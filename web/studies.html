<h1>360° Edge Study</h1><p>เปรียบเทียบภาพแนวทางกับโครงสร้างสามเหลี่ยมจากโมเดลจริงในเว็บ แต่ละภาพจริงใช้กล้องหมุนทุก 45° และไฟล์ mesh รุ่นเดียวกัน รูปทรงยังรอรีวิวก่อนลงสีและทำแอนิเมชัน</p>
<section class="pet" id="jew"><span class="badge">JEW / STAND · SIT · WALK</span><h2>Jew — แมวซน</h2><div class="pair"><figure><img src="/references/jew-edge-study.png" alt="ภาพแนวทาง edge study ของ Jew"><figcaption><h3>ภาพแนวทาง</h3>ภาพที่สร้างขึ้นเพื่อออกแบบรูปทรง ด้านหลังเป็นการตีความเพิ่ม ป้ายมุมในภาพแนวทางเป็นค่าประมาณ โดยช่อง FRONT ของ Jew ยังเอียงเล็กน้อย</figcaption></figure><figure><a href="/studies/jew-turnaround.png"><img src="/studies/jew-turnaround.png" alt="โครงเส้นจริงของ Jew รอบตัว 8 มุม"></a><figcaption><h3>โมเดลจริง — 8 มุม</h3>เรนเดอร์จาก WebGL โดยตรง เส้นแสดงขอบสามเหลี่ยมจริง ไม่มีภาพสร้างทับโมเดล<div class="download"><a href="/studies/jew-turnaround.png" download>ดาวน์โหลดภาพรอบตัว</a></div></figcaption></figure></div><figure class="poses"><a href="/studies/jew-poses.png"><img src="/studies/jew-poses.png" loading="lazy" alt="โมเดลจริงของ Jew ท่ายืน นั่ง และจังหวะเดิน"></a><figcaption>ท่ายืน นั่ง และจังหวะเดิน แต่ละท่าตรวจจากด้านหน้า 45° และด้านข้าง · <a href="/studies/jew-poses.png" download>ดาวน์โหลดภาพท่าทาง</a></figcaption></figure></section>
<section class="pet" id="bo"><span class="badge">BO / STAND · SIT · WALK</span><h2>Bo — ลูกโกลเด้น</h2><div class="pair"><figure><img src="/references/bo-edge-study.png" loading="lazy" alt="ภาพแนวทาง edge study ของ Bo"><figcaption><h3>ภาพแนวทาง</h3>ใช้ตรวจหัว แก้ม ปาก หู อก และสะโพก ภาพนี้เป็นแนวทางทางศิลปะ ไม่ใช่ข้อมูลจุดยอด 3D</figcaption></figure><figure><a href="/studies/bo-turnaround.png"><img src="/studies/bo-turnaround.png" loading="lazy" alt="โครงเส้นจริงของ Bo รอบตัว 8 มุม"></a><figcaption><h3>โมเดลจริง — 8 มุม</h3>ท่านั่งจาก mesh รุ่นเดียวกันทุกมุม พร้อมกล้องหน้า ข้าง หลัง และมุมระหว่างกลาง<div class="download"><a href="/studies/bo-turnaround.png" download>ดาวน์โหลดภาพรอบตัว</a></div></figcaption></figure></div><figure class="poses"><a href="/studies/bo-poses.png"><img src="/studies/bo-poses.png" loading="lazy" alt="โมเดลจริงของ Bo ท่ายืน นั่ง และจังหวะเดิน"></a><figcaption>ท่าโพสสำหรับตรวจรูปทรง ใช้โครงสร้างจุดยอดเดียวกันภายในตัวละคร ยังไม่ใช่แอนิเมชันหรือ rig ที่เสร็จแล้ว · <a href="/studies/bo-poses.png" download>ดาวน์โหลดภาพท่าทาง</a></figcaption></figure></section>
